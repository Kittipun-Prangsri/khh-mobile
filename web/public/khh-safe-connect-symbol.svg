<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6F8A"/>
      <stop offset="100%" stop-color="#084C61"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13A89E"/>
      <stop offset="100%" stop-color="#0B6F8A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#084C61" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Decorative Connection Dots -->
  <circle cx="100" cy="110" r="12" fill="#32B678" opacity="0.8"/>
  <circle cx="410" cy="100" r="10" fill="#32B678" opacity="0.8"/>
  <circle cx="430" cy="380" r="14" fill="#32B678" opacity="0.8"/>
  <circle cx="85" cy="400" r="9" fill="#32B678" opacity="0.8"/>
  <circle cx="256" cy="70" r="8" fill="#32B678" opacity="0.6"/>
  
  <!-- Speech Bubble (White) -->
  <g filter="url(#shadow)">
    <path d="M 256 120 C 170 120 100 180 100 256 C 100 298 120 336 152 362 L 132 412 C 129 420 138 427 145 423 L 202 388 C 219 394 237 397 256 397 C 342 397 412 334 412 256 C 412 180 342 120 256 120 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Heart Icon (Care Teal) -->
  <path d="M 256 335 C 256 335 170 275 170 215 C 170 182 195 160 225 160 C 243 160 252 170 256 175 C 260 170 269 160 287 160 C 317 160 342 182 342 215 C 342 275 256 335 256 335 Z" fill="url(#heartGrad)"/>
  
  <!-- Medical Plus Cross (White) -->
  <rect x="246" y="200" width="20" height="50" rx="6" fill="#FFFFFF"/>
  <rect x="231" y="215" width="50" height="20" rx="6" fill="#FFFFFF"/>
</svg>
